<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="plumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern rounded squircle background with gradient -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#plumbGrad)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" fill="none" />

  <!-- Lucide Droplets Icon -->
  <g transform="translate(8, 8) scale(2)" filter="url(#shadow)">
    <!-- Small droplet -->
    <path 
      d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z" 
      fill="#ffffff" 
      stroke="#ffffff" 
      stroke-width="1.2" 
      stroke-linejoin="round"
    />
    <!-- Large droplet -->
    <path 
      d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97" 
      fill="#ffffff" 
      fill-opacity="0.35"
      stroke="#ffffff" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>
</svg>
