<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="tankBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tankDome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  
  <ellipse cx="300" cy="510" rx="190" ry="30" fill="#000" opacity="0.18"/>

  <!-- Cylindrical Tank Body -->
  <path d="M 150 200 L 150 480 A 150 40 0 0 0 450 480 L 450 200 Z" fill="url(#tankBody)" stroke="#334155" stroke-width="4"/>
  
  <!-- Tank Dome -->
  <ellipse cx="300" cy="200" rx="150" ry="40" fill="url(#tankDome)" stroke="#334155" stroke-width="4"/>
  
  <!-- Horizontal Reinforcement Ribs -->
  <ellipse cx="300" cy="270" rx="150" ry="24" fill="none" stroke="#334155" stroke-width="8"/>
  <ellipse cx="300" cy="340" rx="150" ry="24" fill="none" stroke="#334155" stroke-width="8"/>
  <ellipse cx="300" cy="410" rx="150" ry="24" fill="none" stroke="#334155" stroke-width="8"/>
  <ellipse cx="300" cy="480" rx="150" ry="24" fill="none" stroke="#334155" stroke-width="8"/>

  <!-- Top Inspection Lid -->
  <ellipse cx="300" cy="180" rx="70" ry="20" fill="#0284c7" stroke="#0369a1" stroke-width="5"/>
  <ellipse cx="300" cy="177" rx="50" ry="14" fill="#38bdf8"/>

  <!-- Brass Inlet Fitting -->
  <rect x="135" y="240" width="20" height="24" rx="4" fill="#ca8a04"/>
  <!-- Brass Outlet Fitting -->
  <rect x="445" y="450" width="20" height="24" rx="4" fill="#ca8a04"/>

  <!-- Brand & Capacity Stamp -->
  <rect x="235" y="300" width="130" height="60" rx="12" fill="#000" opacity="0.25"/>
  <text x="300" y="325" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">AquaFlow</text>
  <text x="300" y="350" fill="#fff" font-family="sans-serif" font-size="22" font-weight="900" text-anchor="middle">750L</text>

  <!-- Product Badge -->
  <rect x="30" y="30" width="190" height="32" rx="16" fill="#0284c7"/>
  <text x="125" y="51" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HEAVY DUTY 100% VIRGIN</text>
  
  <text x="300" y="565" fill="#0f172a" font-family="sans-serif" font-size="17" font-weight="900" text-anchor="middle">PLASTIC WATER TANK 750 LITRE</text>
</svg>